name: Deploy to GitHub Pages

on:
  push:
    branches:
      # Publica quando houver push na branch atual do repositorio.
      - master
      # Mantem compatibilidade caso o repositorio seja renomeado para main depois.
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build
        env:
          NUXT_APP_BASE_URL: /poc_nuxt_cms_static/
          NUXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/poc_nuxt_cms_static

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
